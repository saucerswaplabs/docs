<svg width="940" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="SAUCE maximum supply: 20 percent distributed at genesis, 30 percent in completed genesis vesting, and 50 percent allocated to Masterchef minting">
  <rect width="940" height="460" rx="16" fill="#0A0A0B"/>
  <g transform="translate(230,220)">
    <g transform="rotate(-90)">
      <circle r="100" fill="none" stroke="#44E760" stroke-width="44" stroke-dasharray="125.664 628.318" stroke-dashoffset="0"/>
      <circle r="100" fill="none" stroke="#7B96FF" stroke-width="44" stroke-dasharray="188.495 628.318" stroke-dashoffset="-125.664"/>
      <circle r="100" fill="none" stroke="#D6C9FF" stroke-width="44" stroke-dasharray="314.159 628.318" stroke-dashoffset="-314.159"/>
    </g>
    <text y="-8" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="600">1B</text>
    <text y="16" text-anchor="middle" fill="#A1A1AA" font-size="13">SAUCE max supply</text>
  </g>
  <g font-size="17">
    <g transform="translate(440,120)">
      <rect width="16" height="16" rx="3" fill="#44E760"/>
      <text x="30" y="14" fill="#FFFFFF">Distributed at genesis</text>
      <text x="430" y="14" fill="#FFFFFF" text-anchor="end">20%</text>
      <text x="30" y="43" fill="#A1A1AA" font-size="14">200 million SAUCE</text>
    </g>
    <g transform="translate(440,200)">
      <rect width="16" height="16" rx="3" fill="#7B96FF"/>
      <text x="30" y="14" fill="#FFFFFF">Genesis vesting</text>
      <text x="430" y="14" fill="#FFFFFF" text-anchor="end">30%</text>
      <text x="30" y="43" fill="#A1A1AA" font-size="14">300 million SAUCE · schedule completed</text>
    </g>
    <g transform="translate(440,280)">
      <rect width="16" height="16" rx="3" fill="#D6C9FF"/>
      <text x="30" y="14" fill="#FFFFFF">Masterchef emission allocation</text>
      <text x="430" y="14" fill="#FFFFFF" text-anchor="end">50%</text>
      <text x="30" y="43" fill="#A1A1AA" font-size="14">500 million SAUCE · minted over time</text>
    </g>
  </g>
  <text x="470" y="405" text-anchor="middle" fill="#A1A1AA" font-size="14">The supply structure is unchanged by Phase 1. Future reward destinations remain governance-adjustable.</text>
</svg>
